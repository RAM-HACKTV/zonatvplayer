<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REPRODUCTOR DE EVENTOS X1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      background: #0a0e17;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }
    #videoPlayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #videoPlayer iframe,
    #videoPlayer video {
      width: 100%;
      height: 90%;
      border: none;
      background: #000;
    }
    #logo {
      position: fixed;
      top: 10px;
      right: 10px;
      width: 60px;
      z-index: 10;
      cursor: pointer;
    }
    .error-container {
      color: #ff6b6b;
      text-align: center;
      padding: 20px;
    }
    .error-container h2 {
      font-size: 1.8rem;
      margin-bottom: 10px;
    }
    .error-container a {
      color: #00f0ff;
      text-decoration: underline;
      font-weight: bold;
    }
    .error-container .btn {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 25px;
      background: #00f0ff;
      color: #000;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .error-container .btn:hover {
      background: #9d00ff;
      color: #fff;
    }
    @media (max-width: 600px) {
      #logo { width: 45px; }
      .error-container h2 { font-size: 1.4rem; }
    }
  </style>

  <script src="https://graduateamazingly.com/5a/5b/14/5a5b1499d639b6ffdc7032792028cba1.js"></script>
</head>
<body>

  <div id="videoPlayer">
    <!-- Logo / enlace de ayuda -->
    <a href="https://t.me/+9Dl05_RJzTViYTUx" target="_blank" rel="noopener">
      <img alt="Logo" id="logo" src="https://i.imgur.com/4oRZ3jy.png">
    </a>
  </div>

  <script>
    (function() {
      const container = document.getElementById('videoPlayer');

      // Obtener la URL del parámetro 'get'
      const params = new URLSearchParams(window.location.search);
      const url = params.get('get');

      // Si no hay URL, mostrar error
      if (!url) {
        container.innerHTML = `
          <div class="error-container">
            <h2>⚠️ ERROR...</h2>
            <p>TRANSMISIÓN..NO DISPONIBLE.</p>
          </div>
        `;
        return;
      }

      // Detectar si la URL es un archivo de video directo
      const isVideoFile = /\.(mp4|m3u8|webm|ogg|mkv|avi|mov)(\?.*)?$/i.test(url);

      if (isVideoFile) {
        // Usar elemento <video> nativo
        const video = document.createElement('video');
        video.src = url;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        video.setAttribute('playsinline', '');
        video.style.width = '100%';
        video.style.height = '90%';
        video.style.backgroundColor = '#000';
        container.appendChild(video);

        // Si el video falla, mostrar mensaje
        video.onerror = function() {
          container.innerHTML = `
            <div class="error-container">
              <h2>❌ ERROR..TRANSMISIÓN..NO DISPONIBLE.</h2>
              <p></p>
            </div>
          `;
        };
      } else {
        // Intentar cargar en iframe (página web, stream embebido)
        const iframe = document.createElement('iframe');
        iframe.src = url;
        iframe.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
        iframe.allowFullscreen = true;
        iframe.setAttribute('allowfullscreen', '');
        iframe.style.width = '100%';
        iframe.style.height = '90%';
        iframe.style.border = 'none';
        iframe.style.backgroundColor = '#000';
        container.appendChild(iframe);

        // Temporizador para detectar si el iframe no carga (por si no dispara onerror)
        let loaded = false;
        iframe.onload = function() {
          loaded = true;
        };
        setTimeout(() => {
          if (!loaded) {
            // Si después de 8 segundos no se ha cargado, probablemente está bloqueado
            container.innerHTML = `
              <div class="error-container">
                <h2>⏳ ERROR..TRANSMISIÓN..NO DISPONIBLE.</h2>
              </div>
            `;
          }
        }, 8000);

        // También manejar error del iframe
        iframe.onerror = function() {
          container.innerHTML = `
            <div class="error-container">
              <h2>❌ ERROR..TRANSMISIÓN..NO DISPONIBLE.</h2>
            </div>
          `;
        };
      }
    })();
  </script>

  <script>
    (function () {
      let adblockDetectado = false;
      let dnsBloqueado = false;
      let overlayMostrado = false;

      // 1. Detectar AdBlock
      const bait = document.createElement('div');
      bait.className = 'adsbox';
      bait.style.position = 'absolute';
      bait.style.left = '-999px';
      bait.style.height = '10px';
      bait.innerHTML = '&nbsp;';
      document.body.appendChild(bait);

      setTimeout(() => {
        if (bait.offsetHeight === 0) {
          adblockDetectado = true;
          mostrarOverlay();
        }
        if (bait.parentNode) bait.remove();
      }, 100);

      // 2. Detectar DNS bloqueador (petición falsa)
      try {
        fetch("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js", {
          method: "HEAD",
          mode: "no-cors",
          cache: "no-store"
        }).catch(() => {
          dnsBloqueado = true;
          mostrarOverlay();
        });
      } catch (e) {
        dnsBloqueado = true;
        mostrarOverlay();
      }

      // 3. Mostrar overlay si algo falla
      function mostrarOverlay() {
        if (overlayMostrado) return;
        if (!(adblockDetectado || dnsBloqueado)) return;
        overlayMostrado = true;

        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = '0';
        overlay.style.left = '0';
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.background = '#111';
        overlay.style.color = '#fff';
        overlay.style.zIndex = '99999';
        overlay.style.display = 'flex';
        overlay.style.flexDirection = 'column';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.padding = '20px';
        overlay.style.textAlign = 'center';
        overlay.innerHTML = `
          <h2>🚫 Lo sentimos...</h2>
          <p>Detectamos que estás utilizando un bloqueador de anuncios o DNS que impide que carguemos nuestro contenido.</p>
          <p>Por favor, desactívalo para poder acceder.</p>
          <br>
          <button onclick="location.reload()" style="
            background: #e63946;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
          ">Reintentar</button>
        `;
        document.body.innerHTML = ''; // borra todo el contenido visible
        document.body.appendChild(overlay);
      }
    })();

    /* ---------- Funciones auxiliares (con guardas para evitar errores) ---------- */
    function ocultarSiExiste(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }
    function mostrarSiExiste(id, display) {
      const el = document.getElementById(id);
      if (el) el.style.display = display || 'block';
    }

    function iniciarProceso() {
      const url = "https://sf0d1k20if8.iqku3h9qvdhkt.fyi/uf6tYzIVd2tkd/StUzS9MSVpvVroGjdDICq7Kw9RpFOl7oEFp0bbY1Ht6aORxi1RfSUeFJtJaQx3dXr8yTr6f.php";

      const win = window.open(url, '_blank');

      if (!win) {
        window.location.href = url;
      }

      // ocultar imagen y anuncio (si existen)
      ocultarSiExiste('activationImage');

      const adContainer = document.querySelector('.ad-container');
      if (adContainer) adContainer.style.display = 'none';

      // mostrar botón "YA COMPLETÉ"
      mostrarSiExiste('verificacionBox', 'block');
    }

    function confirmarPaso() {
      ocultarSiExiste('verificacionBox');
      if (typeof startCountdown === 'function') {
        startCountdown();
      }
    }

    function activarConFetch() {
      // Petición segura: si falla, igualmente mostramos el resultado final
      const finalizar = function () {
        ocultarSiExiste('step1');
        mostrarSiExiste('finalResult', 'block');
        mostrarSiExiste('activatedBox', 'block');
        mostrarSiExiste('pinBox', 'block');
      };

      try {
        fetch(window.location.href, { method: 'POST' })
          .then(finalizar)
          .catch(finalizar);
      } catch (e) {
        finalizar();
      }
    }
  </script>

  <script disable-devtool-auto src='https://cdn.jsdelivr.net/npm/disable-devtool'></script>

</body>
</html>
