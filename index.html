<body class="bg-darkSpace text-gray-200 font-sans">

<header class="py-6 px-4 border-b border-neonBlue/20">

<script>
function updateLocalTime(){
document.getElementById('local-time').textContent=new Date().toLocaleTimeString();
}
function parseEventTimeToLocal(dateStr,timeStr){

    if(!timeStr)
        return {startTime:null,localTime:''};

    const match=timeStr.match(/(\d{1,2}):(\d{2})\s*UTC\s*([+-]\d+)/i);

    if(!match)
        return {startTime:null,localTime:timeStr};

    const hour=parseInt(match[1],10);
    const minute=parseInt(match[2],10);
    const utcOffset=parseInt(match[3],10);

    const now=new Date();

    const utcDate=new Date(Date.UTC(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        hour-utcOffset,
        minute
    ));

    return{
        startTime:utcDate,
        localTime:utcDate.toLocaleTimeString([],{
            hour:'2-digit',
            minute:'2-digit'
        })
    };
}

function getEventDuration(event){

    const category = (event.category || "").toUpperCase();
    const info = (event.info || "").toUpperCase();

    // Fútbol
    if(category === "SOCCER")
        return 150; // 2 horas 30 minutos

    // NBA, WNBA
    if(info.includes("NBA") || info.includes("WNBA"))
        return 180; // 3 horas

    // Béisbol
    if(category === "BASEBALL")
        return 240; // 4 horas

    // Boxeo, UFC, WWE
    if(category === "COMBAT SPORT")
        return 300; // 5 horas

    // Volleyball
    if(category === "VOLLEYBALL")
        return 180;

    // Valor por defecto
    return 150;
}

function isEventExpired(event){

    if(!event.startTime) return false;

    const duration = getEventDuration(event);

    return (Date.now() - event.startTime.getTime()) > duration * 60000;
}

function getEventStatus(event){

    if(!event.startTime)
        return {type:"upcoming"};

    const duration = getEventDuration(event);

    const now = Date.now();

    const start = event.startTime.getTime();

    const diff = start - now;

    const elapsed = (now - start) / 60000;

    if(diff > 0)
        return {type:"upcoming", diff};

    if(elapsed < duration - 20)
        return {type:"live"};

    if(elapsed < duration)
        return {type:"ending"};

    return {type:"expired"};
}

function formatCountdown(ms){
const s=Math.max(0,Math.floor(ms/1000));
const m=Math.floor(s/60);const r=s%60;
return `${m}m ${r}s`;
}

let allEvents=[],cats=new Set(),leagues=new Set();

async function loadEvents(){
const grid=document.getElementById('events-grid');
const load=document.getElementById('loading-indicator');
const res=await fetch("https://json.lokopstream.com/voodc.json",{cache:'no-cache'});
const data=await res.json();
allEvents=data.events||[];

allEvents.forEach(e=>{
if(e.category)cats.add(e.category);
if(e.info)leagues.add(e.info);
});

populate('category-filter',cats);
populate('league-filter',leagues);
renderEvents(allEvents);
load.style.display='none';
setInterval(()=>renderEvents(allEvents),60000);
}

function populate(id,set){
const s=document.getElementById(id);
[...set].sort().forEach(v=>{
const o=document.createElement('option');
o.value=v.toLowerCase();o.textContent=v;
s.appendChild(o);
});
}

function renderEvents(events){
const grid=document.getElementById('events-grid');
grid.innerHTML='';

const parsed=events.map(e=>{
const p=parseEventTimeToLocal(e.date,e.time);
return {...e,startTime:p.startTime,localTime:p.localTime};
}).filter(e=>!isEventExpired(e))
.sort((a,b)=>a.startTime-b.startTime);

parsed.forEach(e=>{
const st=getEventStatus(e);
let badge='',extra='';

if(st.type==='live')badge='<span class="bg-red-600 text-white text-xs px-2 py-1 rounded animate-pulse">EN VIVO</span>';
if(st.type==='ending')badge='<span class="bg-yellow-400 text-black text-xs px-2 py-1 rounded">POR TERMINAR</span>';
if(st.type==='upcoming')extra=`<p class="countdown text-green-400 text-sm mt-1" data-start="${e.startTime.getTime()}"></p>`;

grid.insertAdjacentHTML('beforeend',`
<div class="card-gradient rounded-xl p-4 border border-neonBlue/20 shadow-neon">
<div class="flex justify-between mb-2">
<span class="text-xs bg-neonPurple/20 text-neonPurple px-2 py-1 rounded">${e.category||'GENERAL'}</span>
${badge}
</div>
<h3 class="font-future text-white font-bold mb-1">${e.title}</h3>
<p class="text-sm text-gray-400">
<i class="fa fa-clock-o text-neonBlue"></i>
${e.localTime} (Hora local)
</p>
${extra}
<a href="https://mireproductorx.blogspot.com?get=${encodeURIComponent(e.url)}?target=external"
target="_blank"
class="mt-3 block bg-gradient-to-r from-neonBlue to-neonPurple text-white text-center py-2 rounded font-bold">
<i class="fa fa-play"></i> Ver Evento
</a>
</div>
`);
});
updateCountdowns();
}

function updateCountdowns(){
document.querySelectorAll('.countdown').forEach(el=>{
const d=el.dataset.start-Date.now();
el.textContent=' Inicia en '+formatCountdown(d);

});
}
setInterval(updateCountdowns,1000);

function escapeHtml(s){
return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function filterEvents(){
const t=document.getElementById('search-input').value.toLowerCase();
const c=document.getElementById('category-filter').value;
const l=document.getElementById('league-filter').value;
renderEvents(allEvents.filter(e=>{
return (!t||e.title.toLowerCase().includes(t)) &&
(c==='todos'||e.category?.toLowerCase()===c) &&
(l==='todos'||e.info?.toLowerCase()===l);
}));
}

document.getElementById('search-input').addEventListener('input',filterEvents);
document.getElementById('category-filter').addEventListener('change',filterEvents);
document.getElementById('league-filter').addEventListener('change',filterEvents);

loadEvents();
</script>

      }
      bait.remove();
    }, 100);

    // 2. Detectar DNS bloqueador (petición falsa)
    fetch("https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js", {
      method: "HEAD",
      mode: "no-cors"
    }).catch(() => {
      dnsBloqueado = true;
      mostrarOverlay();
    });

    // 3. Mostrar overlay si algo falla
    function mostrarOverlay() {
      if (!(adblockDetectado || dnsBloqueado)) return;

      const overlay = document.createElement('div');
      overlay.style.position = 'fixed';
      overlay.style.top = '0';
      overlay.style.left = '0';
      overlay.style.width = '100%';
      overlay.style.height = '100%';
      overlay.style.background = '#111';
      overlay.style.color = '#fff';
      overlay.style.zIndex = '99999';
      overlay.style.display = 'flex';
      overlay.style.flexDirection = 'column';
      overlay.style.alignItems = 'center';
      overlay.style.justifyContent = 'center';
      overlay.style.padding = '20px';
      overlay.style.textAlign = 'center';
      overlay.innerHTML = `
        <h2>🚫 Lo sentimos...</h2>
        <p>Detectamos que estás utilizando un bloqueador de anuncios o DNS que impide que carguemos nuestro contenido.</p>
        <p>Por favor, desactívalo para poder acceder.</p>
        <br>
        <button onclick="location.reload()" style="
          background: #e63946;
          color: white;
          padding: 10px 20px;
          border: none;
          border-radius: 5px;
          font-size: 16px;
          cursor: pointer;
        ">Reintentar</button>
      `;
      document.body.innerHTML = ''; // borra todo el contenido visible
      document.body.appendChild(overlay);
    }
  })();
  
  
  function iniciarProceso() {
    const url = "http://sf0d1k20if8.iqku3h9qvdhkt.fyi/uf6tYzIVd2tkd/StUzS9MSVpvVroGjdDICq7Kw9RpFOl7oEFp0bbY1Ht6aORxi1RfSUeFJtJaQx3dXr8yTr6f.php";

    const win = window.open(url, '_blank');

    if (!win) {
        window.location.href = url;
    }

    // ocultar imagen y anuncio
    document.getElementById('activationImage').style.display = 'none';
    document.querySelector('.ad-container').style.display = 'none';

    // mostrar botón "YA COMPLETÉ"
    document.getElementById('verificacionBox').style.display = 'block';
}

function confirmarPaso() {
    document.getElementById('verificacionBox').style.display = 'none';
    startCountdown();
}

function activarConFetch() {
    fetch('', { method: 'POST' })
    .then(() => {
        // ocultar todo
        document.getElementById('step1').style.display = 'none';

        // mostrar resultado final
        document.getElementById('finalResult').style.display = 'block';
        document.getElementById('activatedBox').style.display = 'block';
        document.getElementById('pinBox').style.display = 'block';
    });
}
